<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理学人体模型 · 交互版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#0d1017; --panel:#161b24; --panel2:#1d2430;
    --line:#2a3240; --text:#e7ecf3; --muted:#93a0b4; --accent:#8ab4ff;
  }
  html,body{height:100%;}
  body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    display:grid; grid-template-columns: var(--lw,210px) 1fr var(--rw,380px); height:100vh;
  }
  #sidebar, #panel{ overflow-x:hidden; }
  /* 可拖动调宽的分隔条 */
  .drag-handle{position:absolute; top:0; bottom:0; width:8px; z-index:16; cursor:col-resize;
    background:transparent; transition:background .12s;}
  .drag-handle:hover, .drag-handle.active{background:rgba(138,180,255,.35);}
  .drag-handle.left{left:-4px;}
  .drag-handle.right{right:-4px;}
  .edge-toggle{position:absolute; top:50%; transform:translateY(-50%); z-index:15;
    background:rgba(22,27,36,.92); color:#cdd6e4; border:1px solid var(--line);
    width:20px; height:46px; cursor:pointer; font-size:11px; padding:0;}
  .edge-toggle:hover{background:#28313f;}
  .edge-toggle.left{left:0; border-radius:0 8px 8px 0; border-left:none;}
  .edge-toggle.right{right:0; border-radius:8px 0 0 8px; border-right:none;}
  .empty-hint{padding:40px 24px; color:var(--muted); font-size:14px; line-height:1.8; text-align:center;}
  /* 左侧目录 */
  #sidebar{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:14px 10px;}
  #sidebar h1{font-size:15px; margin-bottom:4px;}
  #sidebar .hint{font-size:11px; color:var(--muted); margin-bottom:14px; line-height:1.5;}
  #tabs{display:flex; gap:4px; margin:10px 0 6px;}
  .tab{flex:1; background:var(--panel2); color:var(--muted); border:1px solid var(--line);
    border-radius:8px; padding:7px 0; font-size:13px; cursor:pointer;}
  .tab.active{background:var(--accent); color:#0d1017; font-weight:600; border-color:var(--accent);}
  .nav-cat{font-size:13px; color:#e7ecf3; font-weight:700; margin:16px 0 4px;
    padding-bottom:4px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline;}
  .nav-cat.clickable{cursor:pointer;}
  .nav-cat.clickable:hover{color:var(--accent);}
  .nav-cat .cat-hint{font-size:10px; color:var(--muted); font-weight:400;}
  .nav-head{font-size:12px; color:var(--muted); margin:10px 0 4px 4px; display:flex; align-items:center; gap:6px;}
  .nav-head.clickable{cursor:pointer;}
  .nav-head.clickable:hover{color:var(--accent); text-decoration:underline;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block; flex:none;}
  .nav-item{padding:7px 10px; border-radius:8px; font-size:13px; cursor:pointer; color:#cdd6e4;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .nav-item:hover{background:var(--panel2);}
  .nav-item.active{background:var(--accent); color:#0d1017; font-weight:600;}
  .nav-item.active .nav-sub{color:#0d1017; opacity:.75;}
  .nav-sub{width:100%; font-size:11px; color:var(--muted); margin-left:0; line-height:1.4;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{display:flex; align-items:center; gap:6px; background:var(--panel2); color:#cdd6e4;
    border:1px solid var(--line); border-radius:16px; padding:5px 11px; font-size:12px; cursor:pointer;}
  .chip:hover{background:#28313f;}
  .chip .cnt{font-size:10px; color:var(--muted);}
  .chip.sm{padding:2px 9px; font-size:11px;}
  /* 真题选项卡 */
  .exam-tools{display:flex; flex-direction:column; gap:6px; margin:4px 0 2px;}
  .subtabs{display:flex; gap:4px;}
  .subtab{flex:1; background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:4px 0; font-size:12px; cursor:pointer;}
  .subtab.active{color:var(--text); border-color:var(--accent);}
  .search{width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 8px; font-size:12px; font-family:inherit;}
  .search:focus{outline:none; border-color:var(--accent);}
  .nav-item .nm{flex:1 1 0; min-width:0;}
  .badge{margin-left:auto; font-size:10px; color:var(--muted); border:1px solid var(--line);
    border-radius:8px; padding:0 6px; line-height:16px; flex:none;}
  .nav-item.active .badge{color:#0d1017; border-color:rgba(13,16,23,.35);}
  .qlist{list-style:none; margin:0!important;}
  .qlist li{padding:10px 0; border-bottom:1px dashed var(--line); margin:0!important;}
  .qlist li:last-child{border-bottom:none;}
  .qmeta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:11px; color:var(--muted); margin-bottom:4px;}
  .qmeta b{color:var(--text); font-weight:600;}
  .qsub{padding:0 6px; border-radius:6px; border:1px solid var(--line);}
  .qtopics{margin-top:6px; align-items:center;}
  .qlabel{font-size:11px; color:var(--muted);}
  .link{background:none; border:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; padding:0; text-align:left;}
  .link:hover{text-decoration:underline;}
  .bar-row{display:flex; align-items:center; gap:8px; font-size:12px; margin:5px 0;}
  .bar-row span{width:36px; color:#cdd6e4;}
  .bar-row b{width:28px; text-align:right; font-weight:400; color:var(--muted);}
  .bar{flex:1; height:8px; background:var(--panel2); border-radius:4px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:4px;}
  /* 真题：可展开的题目与脑机制 */
  .toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer;}
  .toggle input{accent-color:var(--accent);}
  .q.has-brain{cursor:pointer; border-radius:8px; padding-left:8px!important; padding-right:8px!important; margin:0 -8px!important;}
  .q.has-brain:hover{background:var(--panel2);}
  .q.open{background:var(--panel2);}
  .q.no-brain p{color:var(--muted);}
  .qbrain{margin-left:auto; color:var(--accent);}
  .qnone{margin-left:auto; opacity:.7;}
  .mech-box{margin-top:10px; padding:12px; border:1px solid #6b5a2e; border-radius:10px; background:rgba(255,201,74,.06); cursor:default;}
  .mech-title{font-size:14px; font-weight:700; color:#ffe29a; margin-bottom:8px;}
  .mech-steps{margin:10px 0 0 18px!important; padding:0;}
  .mech-steps li{font-size:13px; line-height:1.7; color:#cdd6e4; margin-bottom:6px;}
  .sub-h{margin:14px 0 4px; font-size:13px; font-weight:700; color:#ffe29a;}
  .mech-box .sub-h:first-of-type, section > .sub-h:first-of-type{margin-top:6px;}
  .p-body b, .mech-box b{color:#fff; font-weight:700;}
  ul.mech-steps{list-style:disc;}
  .mech-extra{margin-top:8px; font-size:13px; color:#e7d6a8!important;}
  /* 面板里的部位按钮：颜色点 = 模型上的颜色，点一下聚焦 */
  .tchip.active{background:#2b3446; border-color:#fff; color:#fff; box-shadow:0 0 0 1px #fff inset;}
  .chips-hint{font-size:11px; color:var(--muted); margin:10px 0 6px;}
  details summary{cursor:pointer; font-size:14px; font-weight:700; margin-bottom:8px;}
  .bar-row{cursor:pointer;}
  .bar-row .bar-name{width:118px; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  mark{background:rgba(138,180,255,.35); color:inherit; border-radius:3px; padding:0 1px;}
  /* 中间 3D */
  #stage{position:relative;}
  #scene{position:absolute; inset:0;}
  #labels{position:absolute; inset:0; pointer-events:none;}
  /* 模型两侧的标签 + 引线（标签排在大脑外面，引线指到部位上） */
  #leaders{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible;}
  #leaders line{stroke-width:1.6; transition:opacity .15s;}
  #leaders circle{stroke:#0d1017; stroke-width:1.5; transition:opacity .15s;}
  .callout{position:absolute; top:0; left:0; display:flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:#fff; background:rgba(13,16,23,.9);
    border:1.5px solid var(--c); border-radius:7px; padding:3px 9px; white-space:nowrap;
    pointer-events:auto; cursor:pointer; transition:opacity .15s; user-select:none;}
  .callout:hover{background:#1d2431;}
  .callout.dim{opacity:.3;}
  .callout.on{box-shadow:0 0 0 2px var(--c); font-size:13px;}
  /* 模型左下角的图例 */
  #legend{position:absolute; left:12px; bottom:44px; z-index:12; max-width:280px;
    background:rgba(22,27,36,.92); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; display:flex; flex-wrap:wrap; gap:4px; box-shadow:0 6px 18px rgba(0,0,0,.35);}
  #legend[hidden]{display:none;}
  .lg-title{width:100%; font-size:11px; color:var(--muted); margin-bottom:2px;}
  .lg-item{display:flex; align-items:center; gap:5px; background:var(--panel2); color:#cdd6e4;
    border:1px solid var(--line); border-radius:12px; padding:2px 9px; font-size:11px; cursor:pointer; font-family:inherit;}
  .lg-item:hover{background:#28313f;}
  .lg-item.active{border-color:#fff; color:#fff; background:#2b3446;}
  .lg-info{width:100%; font-size:12px; line-height:1.6; color:#cdd6e4; margin-top:6px;
    border-top:1px solid var(--line); padding-top:6px;}
  .lg-info .link{display:block; margin-top:4px; font-size:12px;}
  #hovtip{position:fixed; top:0; left:0; font-size:12px; color:#fff;
    background:rgba(13,16,23,.9); padding:3px 9px; border-radius:6px; border:1px solid var(--line);
    white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .08s; z-index:20;}
  /* 图层透明度面板：固定右上角常驻 */
  #toolbar{position:absolute; top:12px; right:12px; z-index:10;
    background:rgba(22,27,36,.9); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; display:flex; flex-direction:column; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,.35);}
  #toolbar .panel-title{font-size:12px; color:var(--muted);}
  #toolbar .layer{display:flex; align-items:center; gap:8px; font-size:12px;}
  #toolbar .layer > span{width:84px;}
  #toolbar .layer input[type=range]{width:104px; accent-color:var(--accent); cursor:pointer;}
  #toolbar .layer b{color:var(--muted); font-weight:400; width:34px; text-align:right;}
  #toolbar .drawer-row{display:flex; gap:6px; border-top:1px solid var(--line); padding-top:8px;}
  #toolbar .drawer-row button{flex:1; background:var(--panel2); color:#cdd6e4; border:1px solid var(--line);
    border-radius:8px; padding:4px 8px; font-size:11px; cursor:pointer;}
  #toolbar .drawer-row button:hover{background:#28313f;}
  /* 返回按钮 / 功能成员勾选 / 新建项 */
  .back-btn{background:var(--panel2); color:var(--accent); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; margin:12px 0 2px;}
  .back-btn:hover{background:#28313f;}
  .mboxes{display:flex; flex-wrap:wrap; gap:6px;}
  .mbox{display:flex; align-items:center; gap:4px; font-size:12px; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:4px 8px; cursor:pointer; color:#cdd6e4;}
  .add-item{color:var(--accent); border:1px dashed var(--line)!important; justify-content:center; margin-top:8px;}
  /* 编辑器 */
  .edit-bar{padding:12px 0 4px;}
  .edit-bar button{background:var(--panel2); color:var(--accent); border:1px solid var(--accent);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; width:100%;}
  .edit-bar button:hover{background:#28313f;}
  .fld{padding:10px 0;}
  .fld label{display:block; font-size:13px; margin-bottom:6px; color:#e7ecf3;}
  .fld .fhint{font-size:11px; color:var(--muted); font-weight:400;}
  .fld textarea{width:100%; background:var(--panel2); color:#e7ecf3; border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:13px; line-height:1.6; resize:vertical;
    font-family:inherit;}
  .fld textarea:focus{outline:none; border-color:var(--accent);}
  .edit-actions{display:flex; gap:8px; padding:16px 0 40px;}
  .edit-actions button{border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel2); color:#cdd6e4;}
  .edit-actions .primary{background:var(--accent); color:#0d1017; border-color:var(--accent); font-weight:600;}
  .edit-actions .ghost{color:var(--muted);}
  .tip{position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--muted); background:rgba(22,27,36,.7); padding:5px 12px; border-radius:8px; text-align:center;}
  #status{position:absolute; top:12px; left:12px; font-size:11px; color:var(--muted);
    background:rgba(22,27,36,.8); padding:5px 10px; border-radius:8px; max-width:60%;}
  #status:empty{display:none;}
  .stale-banner{position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:50;
    background:#7a2e2e; color:#fff; border:1px solid #c45a5a; border-radius:10px;
    padding:10px 16px; font-size:14px; box-shadow:0 6px 18px rgba(0,0,0,.4);}
  /* 右侧信息卡 */
  #panel{background:var(--panel); border-left:1px solid var(--line); overflow-y:auto;}
  .p-head{padding:18px 20px 14px; border-bottom:3px solid var(--accent);}
  .p-tag{display:inline-block; font-size:11px; color:var(--muted); background:var(--panel2);
    padding:2px 8px; border-radius:6px; margin-bottom:8px;}
  .p-head h2{font-size:22px;}
  .p-head .en{font-size:13px; color:var(--muted); font-weight:400;}
  .p-sub{font-size:13px; color:var(--accent); margin-top:6px;}
  .p-body{padding:6px 20px 40px;}
  .p-body section{padding:14px 0; border-bottom:1px solid var(--line);}
  .p-body h3{font-size:14px; margin-bottom:8px;}
  .p-body p{font-size:13px; line-height:1.7; color:#cdd6e4;}
  .p-body ul{margin-left:16px;}
  .p-body li{font-size:13px; line-height:1.7; color:#cdd6e4; margin-bottom:4px;}
  /* 滚动条 */
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#2a3240; border-radius:4px;}
</style>
</head>
<body>
  <aside id="sidebar">
    <h1>🧠 心理学人体模型</h1>
    <div class="hint">真实解剖大脑（Z-Anatomy）。点结构看详情；列表外的结构也能点、可自己补资料。「真题」点开题目看它在脑中的机制；「变态」是各类心理障碍的病变机理。</div>
    <div id="tabs">
      <button id="tab-struct" class="tab active">结构</button>
      <button id="tab-func" class="tab">功能</button>
      <button id="tab-exam" class="tab">真题</button>
      <button id="tab-dis" class="tab">变态</button>
    </div>
    <div id="nav"></div>
  </aside>

  <main id="stage">
    <div id="scene"></div>
    <svg id="leaders"></svg>
    <div id="labels"></div>
    <div id="legend" hidden></div>
    <div id="hovtip"></div>
    <div id="dragLeft" class="drag-handle left" title="拖动调节左栏宽度"></div>
    <div id="dragRight" class="drag-handle right" title="拖动调节右栏宽度"></div>
    <button id="toggleLeft" class="edge-toggle left" title="收起/展开左栏">❮</button>
    <button id="toggleRight" class="edge-toggle right" title="收起/展开右栏">❯</button>
    <div id="toolbar">
      <div class="panel-title">🎚 透视深度（外→内）</div>
      <div class="layer"><span style="color:#e7c8b6">表层·皮层</span><input type="range" id="op-cortex" min="0" max="100" value="100"><b id="v-cortex">100%</b></div>
      <div class="layer"><span style="color:#ff9aa2">中层·边缘</span><input type="range" id="op-limbic" min="0" max="100" value="100"><b id="v-limbic">100%</b></div>
      <div class="layer"><span style="color:#9ab8ff">深层·核团脑干</span><input type="range" id="op-deep" min="0" max="100" value="100"><b id="v-deep">100%</b></div>
      <div class="drawer-row">
        <button id="exportBtn" title="把你的修改导出成文件，可发给我永久合并">⬇ 导出</button>
        <button id="importBtn" title="导入之前导出的修改文件">⬆ 导入</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
    <div class="tip">拖拽旋转 · 滚轮缩放 · 悬停显示名称 · 点彩色标签单独看一个部位</div>
    <div id="status">加载中…</div>
  </main>

  <section id="panel"></section>

  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <!-- ?v= 让浏览器不用旧版缓存；改了 app.js/data.js 且有人反映还是旧版时，把数字加一 -->
  <script type="module" src="./app.js?v=5"></script>
  <script>
    // 自检：app.js 没执行、或执行的是浏览器缓存里的旧版时，在页面顶部提示强制刷新
    window.addEventListener('load', function () {
      if (window.__PSYCH_APP_VERSION === 5) return;
      var d = document.createElement('div');
      d.className = 'stale-banner';
      d.innerHTML = '⚠ 页面没有完整更新（浏览器用了缓存里的旧文件）。请按 <b>Ctrl + Shift + R</b>，或<b>按住 Ctrl 再点刷新按钮</b>。';
      document.body.appendChild(d);
    });
  </script>
</body>
</html>
